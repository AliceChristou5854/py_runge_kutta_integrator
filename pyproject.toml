[project]
name = "py-runge-kutta-integrator"
version = "0.1.0"
description = "A fixed-step fourth-order Runge-Kutta integrator for systems of first-order ODEs, driven by a plain Python callable and depending only on the standard library."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
